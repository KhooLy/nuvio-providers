<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Netflix Mobile Player — Mockup</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --red: #e50914;
    --white: #f5f5f1;
    --dim: rgba(255, 255, 255, 0.7);
    --dimmer: rgba(255, 255, 255, 0.45);
    --track: rgba(255, 255, 255, 0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 800px at 50% -10%, #2a2a2e 0%, #0d0d0f 55%, #060607 100%);
    font-family: "Netflix Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    color: var(--white);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px 16px 56px;
  }

  .caption { font-size: 13px; color: var(--dimmer); letter-spacing: 0.02em; text-align: center; max-width: 760px; }
  .caption b { color: var(--dim); font-weight: 600; }

  .phone {
    position: relative;
    width: min(900px, 94vw);
    aspect-ratio: 19.5 / 9.4;
    border-radius: 30px;
    background: #000;
    border: 7px solid #17171a;
    box-shadow: 0 0 0 1px #2e2e33, 0 40px 90px -20px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    overflow: hidden;
    isolation: isolate;
    user-select: none;
  }

  .stage {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 90% at 28% 30%, rgba(90, 30, 40, 0.55), transparent 60%),
      radial-gradient(70% 80% at 78% 72%, rgba(30, 45, 70, 0.6), transparent 62%),
      linear-gradient(140deg, #101018 0%, #05050a 60%, #000 100%);
    cursor: pointer;
    touch-action: none;
  }
  .stage .frame { position: absolute; inset: 0; background: #000; pointer-events: none; }

  .poster-text {
    position: absolute; left: 6%; top: 50%; transform: translateY(-50%);
    font-weight: 900; letter-spacing: 0.06em; line-height: 0.94;
    font-size: clamp(15px, 2.7vw, 30px); color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.85); pointer-events: none; opacity: 0.85;
  }
  .poster-text small { display: block; font-size: 0.34em; letter-spacing: 0.34em; font-weight: 700; color: var(--red); margin-bottom: 10px; }

  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.35'/></svg>");
  }

  .scrim { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 2; transition: opacity 0.35s ease; }
  .scrim.top { top: 0; height: 34%; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0)); }
  .scrim.bottom { bottom: 0; height: 48%; background: linear-gradient(to top, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0)); }

  .overlay { position: absolute; inset: 0; z-index: 3; pointer-events: none; transition: opacity 0.32s ease, visibility 0.32s; }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay button, .overlay .scrub, .overlay input { pointer-events: auto; }

  .topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
  .topbar .titlewrap { min-width: 0; padding-left: 6px; padding-right: 8px; }
  .topbar .title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { font-size: 12px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .spacer { flex: 1; }

  .iconbtn { display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--white); cursor: pointer; padding: 8px; border-radius: 50%; line-height: 1; font-family: inherit; }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn svg { display: block; }

  .center { position: absolute; top: 45%; left: 0; right: 0; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; gap: clamp(30px, 12vw, 130px); }
  .bigbtn { background: transparent; border: 0; color: var(--white); cursor: pointer; padding: 8px; display: grid; place-items: center; transition: transform 0.12s ease; }
  .bigbtn:active { transform: scale(0.88); }

  .bottombar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 20px 16px; }

  .scrub { position: relative; padding: 14px 0 10px; cursor: pointer; touch-action: none; }
  .scrub .track { position: relative; height: 3px; border-radius: 3px; background: var(--track); transition: height 0.15s ease; }
  .scrub.expanded .track { height: 6px; }
  .scrub .buffer { position: absolute; inset: 0 auto 0 0; background: rgba(255, 255, 255, 0.4); border-radius: inherit; }
  .scrub .fill { position: absolute; inset: 0 auto 0 0; background: var(--red); border-radius: inherit; }
  .scrub .thumb { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--red); transform: translate(-50%, -50%) scale(0.001); transition: transform 0.15s ease; }
  .scrub.expanded .thumb { transform: translate(-50%, -50%) scale(1); }
  .scrub .chapter { position: absolute; top: 50%; width: 3px; height: 12px; border-radius: 2px; background: rgba(255, 255, 255, 0.55); transform: translate(-50%, -50%); }

  .preview { position: absolute; bottom: 32px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .preview .thumbimg { width: 132px; aspect-ratio: 16 / 9; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.35); background: radial-gradient(80% 90% at 30% 30%, rgba(110, 40, 50, 0.85), transparent 60%), linear-gradient(140deg, #181826, #06060c); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.22em; color: var(--dimmer); }
  .preview .time { font-size: 12px; font-variant-numeric: tabular-nums; background: rgba(0, 0, 0, 0.6); padding: 3px 9px; border-radius: 6px; font-weight: 600; }

  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: -2px; }

  .speedrow { display: flex; align-items: center; gap: 14px; padding: 4px 6px 2px; overflow: hidden; animation: speedin 0.22s ease; }
  @keyframes speedin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .speedrow .val { font-size: 13px; font-weight: 700; min-width: 54px; font-variant-numeric: tabular-nums; }
  .speedrow input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 20px; background: transparent; cursor: pointer; }
  .speedrow input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--red) var(--pct, 50%), rgba(255,255,255,0.35) var(--pct, 50%)); }
  .speedrow input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%; background: var(--red); }
  .speedrow input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(255,255,255,0.35); }
  .speedrow input[type="range"]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--red); }
  .speedrow input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--red); }

  .buttons { display: flex; align-items: flex-start; justify-content: space-evenly; margin-top: 16px; padding: 0 4px; }
  .vbtn { background: transparent; border: 0; color: var(--dim); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: inherit; font-size: 11.5px; padding: 6px 4px; min-width: 72px; transition: color 0.15s; }
  .vbtn:hover, .vbtn.on { color: var(--white); }
  .vbtn:active { transform: scale(0.94); }
  .vbtn .glyph { color: var(--white); display: grid; place-items: center; }

  .pill { position: absolute; right: 20px; bottom: 118px; display: flex; align-items: center; gap: 12px; background: rgba(20, 20, 22, 0.85); border: 0; color: var(--white); font-family: inherit; font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 6px; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); animation: slidein 0.35s ease; }
  .pill:active { transform: translateY(1px); }
  .pill .ring { transform: rotate(-90deg); }
  .pill .ring circle { fill: none; stroke-width: 3; }
  .pill .ring .bg { stroke: rgba(255, 255, 255, 0.25); }
  .pill .ring .fg { stroke: var(--white); transition: stroke-dashoffset 1s linear; }

  @keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .nudge { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, 0.95); animation: nudge 0.75s ease forwards; pointer-events: none; }
  .nudge.left { left: 12%; } .nudge.right { right: 12%; }
  @keyframes nudge { 0% { opacity: 0; transform: translateY(-50%) scale(0.8); } 30% { opacity: 1; transform: translateY(-50%) scale(1); } 100% { opacity: 0; transform: translateY(-50%) scale(1.05); } }

  .locked-badge { position: absolute; left: 18px; top: 18px; display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.5); padding: 9px 14px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.14); font-size: 12.5px; color: var(--dim); cursor: pointer; animation: slidein 0.25s ease; z-index: 5; }

  .brightness { position: absolute; left: 52px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity 0.25s; }
  .brightness .vrail { position: relative; width: 6px; height: 150px; border-radius: 6px; background: rgba(255, 255, 255, 0.25); overflow: hidden; display: flex; align-items: flex-end; }
  .brightness .vfill { width: 100%; background: var(--white); border-radius: 6px; }
  .brightness svg { color: var(--white); }

  .postplay { position: absolute; inset: 0; z-index: 6; background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.5) 48%, rgba(0, 0, 0, 0.2) 100%); display: flex; align-items: flex-end; padding: 26px 30px; animation: fadein 0.4s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .postplay .card { display: flex; align-items: center; gap: 20px; width: 100%; }
  .postplay .np-art { width: 150px; aspect-ratio: 16 / 9; border-radius: 8px; background: radial-gradient(90% 90% at 30% 25%, rgba(120, 45, 55, 0.9), transparent 60%), linear-gradient(150deg, #1a1a2a, #07070e); border: 1px solid rgba(255, 255, 255, 0.14); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.2em; color: var(--dim); flex: none; }
  .postplay .np-meta { flex: 1; min-width: 0; }
  .postplay .np-label { font-size: 11px; letter-spacing: 0.18em; color: var(--dim); font-weight: 700; }
  .postplay .np-title { font-size: 20px; font-weight: 800; margin: 6px 0 4px; }
  .postplay .np-sub { font-size: 13px; color: var(--dim); }
  .postplay .np-actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .postplay .countdown { font-size: 12px; color: var(--dim); text-align: center; }
  .postplay .countdown b { color: var(--white); }

  .playbtn-filled { background: var(--white); color: #000; border: 0; border-radius: 5px; font-family: inherit; font-weight: 800; font-size: 14px; padding: 12px 22px; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
  .playbtn-filled:active { transform: scale(0.97); }
  .ghostbtn { background: rgba(255, 255, 255, 0.14); color: var(--white); border: 0; border-radius: 5px; font-family: inherit; font-weight: 700; font-size: 13px; padding: 11px 16px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; cursor: pointer; }
  .ghostbtn:active { transform: scale(0.97); }

  .screen { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; flex-direction: column; animation: screenup 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes screenup { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .screen > header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; }
  .screen > header h3 { margin: 0; font-size: 17px; font-weight: 800; flex: 1; }
  .screen .body { flex: 1; overflow: auto; padding: 4px 18px 24px; }
  .screen h4 { margin: 16px 0 6px; font-size: 12px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; font-weight: 700; }
  .screen .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 14.5px; cursor: pointer; }
  .screen .opt:hover { background: rgba(255, 255, 255, 0.04); }
  .screen .opt.on { font-weight: 600; }
  .screen .opt .meta { color: var(--dim); font-size: 12.5px; }
  .screen .opt .check { color: var(--red); flex: none; }

  .season { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 5px; color: var(--white); font-family: inherit; font-weight: 700; font-size: 13.5px; padding: 8px 12px; cursor: pointer; }
  .ep { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; }
  .ep .num { width: 22px; flex: none; font-size: 15px; font-weight: 800; color: var(--dim); text-align: center; }
  .ep .art { width: 116px; aspect-ratio: 16 / 9; border-radius: 5px; flex: none; background: radial-gradient(90% 90% at 30% 25%, rgba(120, 45, 55, 0.85), transparent 60%), linear-gradient(150deg, #1a1a2a, #07070e); border: 1px solid rgba(255, 255, 255, 0.12); display: grid; place-items: center; }
  .ep .info { flex: 1; min-width: 0; }
  .ep .info .row { display: flex; justify-content: space-between; gap: 10px; }
  .ep .info h5 { margin: 0; font-size: 14.5px; }
  .ep .info .dur { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ep .info p { margin: 6px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.45; }
  .ep.playing .info h5 { color: var(--red); }

  .field { display: block; margin: 8px 0 4px; font-size: 12px; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; font-weight: 700; }
  .screen textarea { width: 100%; min-height: 92px; resize: none; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 6px; color: var(--white); font-family: inherit; font-size: 14px; padding: 12px; }
  .screen .submit { width: 100%; margin-top: 18px; background: var(--red); color: #fff; border: 0; border-radius: 5px; font-family: inherit; font-weight: 800; font-size: 15px; padding: 14px; cursor: pointer; }
  .screen .submit:active { transform: scale(0.99); }

  .modal { position: absolute; inset: 0; z-index: 8; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; animation: fadein 0.2s ease; }
  .modal .box { width: min(360px, 82%); background: #141414; border-radius: 8px; padding: 26px 24px 20px; text-align: center; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7); }
  .modal .box h3 { margin: 0 0 6px; font-size: 17px; }
  .modal .box p { margin: 0 0 22px; font-size: 13px; color: var(--dim); }
  .modal .row { display: flex; gap: 10px; }
  .modal .row button { flex: 1; }

  .toast { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 9; background: rgba(0, 0, 0, 0.82); border-radius: 6px; padding: 12px 18px; font-size: 13.5px; animation: fadein 0.2s ease; }

  .hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 10.5px; letter-spacing: 0.14em; color: rgba(255, 255, 255, 0.28); text-transform: uppercase; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
  <div id="root"></div>

  <p class="caption">
    <b>Netflix mobile player</b> mockup — tap the video to toggle controls, double-tap left/right to seek ±10s.
    Swipe up/down on the left edge for <b>brightness</b>. Playback speed is an inline slider; Audio &amp; Subtitles,
    Episodes and Report a Problem open as full screens.
  </p>

function Ico({ name, size = 24, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={style} aria-hidden="true">
      <path d={ICO[name]} fill="currentColor" fillRule="evenodd" />
    </svg>
  );
}

const DURATION = 3022;
const INTRO_AT = 6;
const INTRO_WINDOW = 14;
const NEXT_AT = 0.965;

const CHAPTERS = [0.12, 0.34, 0.58, 0.81];

const EPISODES = [
  { n: 1, title: "Pilot", dur: "48m", syn: "A quiet town, a missing brother, and a job that was never supposed to end." },
  { n: 2, title: "Undertow", dur: "46m", syn: "Old debts surface while the family tries to keep the business afloat." },
  { n: 3, title: "The Quiet Room", dur: "44m", syn: "A favor for a friend pulls them deeper into the arrangement." },
  { n: 4, title: "Fracture", dur: "47m", syn: "The deal cracks when a stranger arrives with proof of what happened." },
  { n: 5, title: "Fallout", dur: "51m", syn: "Every choice they made comes back, all at once." },
];

const REPORT_TOPICS = [
  "Playback problem",
  "Audio problem",
  "Subtitles problem",
  "Wrong title or artwork",
  "Something else",
];

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function Ring({ seconds, total }) {
  const r = 10;
  const c = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(1, seconds / total));
  return (
    <svg className="ring" width="26" height="26" viewBox="0 0 26 26">
      <circle className="bg" cx="13" cy="13" r={r} />
      <circle className="fg" cx="13" cy="13" r={r} strokeDasharray={c} strokeDashoffset={c * (1 - frac)} />
    </svg>
  );
}

function TopBar({ onBack, onReport, onLock, rating, setRating }) {
  return (
    <div className="topbar">
      <button className="iconbtn" aria-label="Back" onClick={onBack}><Ico name="back" size={24} /></button>
      <div className="titlewrap">
        <div className="title">The Handler</div>
        <div className="sub">S1:E{PLAYING_EP} · Fracture</div>
      </div>
      <div className="spacer" />
      <button className="iconbtn" aria-label="Thumbs up" aria-pressed={rating === "up"}
              style={{ opacity: rating === "down" ? 0.45 : 1 }}
              onClick={() => setRating((r) => (r === "up" ? null : "up"))}>
        <Ico name="thumbUp" size={22} />
      </button>
      <button className="iconbtn" aria-label="Thumbs down" aria-pressed={rating === "down"}
              style={{ opacity: rating === "up" ? 0.45 : 1 }}
              onClick={() => setRating((r) => (r === "down" ? null : "down"))}>
        <Ico name="thumbDown" size={22} />
      </button>
      <button className="iconbtn" aria-label="Report a problem" onClick={onReport}><Ico name="report" size={21} /></button>
      <button className="iconbtn" aria-label="Cast"><Ico name="cast" size={22} /></button>

}

function Report({ onClose, onSubmit }) {
  const [topic, setTopic] = useState(null);
  const [text, setText] = useState("");
  return (
    <div className="screen">
      <header>
        <h3>Report a Problem</h3>
        <button className="iconbtn" aria-label="Close" onClick={onClose}><Ico name="close" size={24} /></button>
      </header>
      <div className="body">
        <h4>What went wrong?</h4>
        {REPORT_TOPICS.map((c) => (
          <div key={c} className={"opt" + (c === topic ? " on" : "")} onClick={() => setTopic(c)}>
            <span>{c}</span>
            {c === topic ? <span className="check"><Ico name="check" size={18} /></span> : null}
          </div>
        ))}
        <label className="field" htmlFor="rp">Tell us more (optional)</label>
        <textarea id="rp" value={text} onChange={(e) => setText(e.target.value)}
                  placeholder="Describe what happened…" />

                style={{ opacity: topic ? 1 : 0.5 }}>Submit</button>

}

function App() {
  const [playing, setPlaying] = useState(true);
  const [time, setTime] = useState(3);
  const [visible, setVisible] = useState(true);
  const [locked, setLocked] = useState(false);
  const [lockPrompt, setLockPrompt] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [dragTime, setDragTime] = useState(null);
  const [nudge, setNudge] = useState(null);
  const [screen, setScreen] = useState(null);
  const [speedOpen, setSpeedOpen] = useState(false);
  const [speed, setSpeed] = useState(1);
  const [audio, setAudio] = useState(AUDIO[0]);
  const [sub, setSub] = useState(SUBS[0]);
  const [skipDismissed, setSkipDismissed] = useState(false);
  const [autoNext, setAutoNext] = useState(8);
  const [rating, setRating] = useState(null);
  const [brightness, setBrightness] = useState(0.7);
  const [brightHud, setBrightHud] = useState(false);
  const [toast, setToast] = useState(null);

  const barRef = useRef(null);
  const hideRef = useRef(null);
  const tapRef = useRef({ t: 0, side: null, timer: null });
  const dragRef = useRef(null);
  const nudgeRef = useRef(null);
  const toastRef = useRef(null);
  const brightRef = useRef(null);

  const nextShown = time >= DURATION * NEXT_AT;
  const introVisible = !skipDismissed && time >= INTRO_AT && time < INTRO_AT + INTRO_WINDOW && !nextShown;
  const introLeft = Math.max(0, Math.ceil(INTRO_AT + INTRO_WINDOW - time));

  const flashToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToast(null), 2200);
  }, []);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setTime((t) => Math.min(DURATION, t + 0.25 * speed)), 250);
    return () => clearInterval(id);
  }, [playing, speed]);

  useEffect(() => { if (nextShown) setPlaying(false); }, [nextShown]);

  useEffect(() => {
    if (!nextShown) return;
    setAutoNext(8);
    const id = setInterval(() => setAutoNext((n) => n - 1), 1000);
    return () => clearInterval(id);
  }, [nextShown]);

  useEffect(() => {
    if (nextShown && autoNext <= 0) { setTime(0); setPlaying(true); }
  }, [autoNext, nextShown]);

  const scheduleHide = useCallback(() => {
    clearTimeout(hideRef.current);
    hideRef.current = setTimeout(() => setVisible(false), 4000);
  }, []);

  useEffect(() => {
    if (visible && playing && !locked && !dragging && !nextShown && !screen && !speedOpen) scheduleHide();
    return () => clearTimeout(hideRef.current);
  }, [visible, playing, locked, dragging, nextShown, screen, speedOpen, scheduleHide]);

  const seekBy = (delta) => {
    setTime((t) => Math.max(0, Math.min(DURATION, t + delta)));
    setPlaying(true);
  };

  const flashNudge = (side) => {
    setNudge({ side, id: Date.now() });
    clearTimeout(nudgeRef.current);
    nudgeRef.current = setTimeout(() => setNudge(null), 750);
  };

  const handleTap = (e) => {
    if (locked || nextShown || screen) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const rel = (e.clientX - rect.left) / rect.width;
    if (rel > 0.34 && rel < 0.66) { setVisible((v) => !v); return; }
    const side = rel <= 0.34 ? "left" : "right";
    const now = Date.now();
    const last = tapRef.current;
    if (last.side === side && now - last.t < 300) {
      clearTimeout(last.timer);
      seekBy(side === "right" ? 10 : -10);
      flashNudge(side);
      tapRef.current = { t: 0, side: null, timer: null };
      return;
    }
    tapRef.current = { t: now, side, timer: setTimeout(() => setVisible((v) => !v), 280) };
  };

  const onStageDown = (e) => {
    if (locked || nextShown || screen) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const rel = (e.clientX - rect.left) / rect.width;
    dragRef.current = { y: e.clientY, rel, mode: null, b: brightness, node: e.currentTarget, id: e.pointerId };
  };
  const onStageMove = (e) => {
    const d = dragRef.current;
    if (!d) return;
    const dy = e.clientY - d.y;
    if (!d.mode && d.rel < 0.32 && Math.abs(dy) > 10) {
      d.mode = "brightness";
      try { d.node.setPointerCapture(d.id); } catch (err) {}
      setBrightHud(true);
      clearTimeout(brightRef.current);
    }
    if (d.mode === "brightness") {
      setBrightness(Math.max(0.05, Math.min(1, d.b - dy / 220)));
    }
  };
  const onStageUp = (e) => {
    const d = dragRef.current;
    dragRef.current = null;
    if (!d) return;
    if (d.mode === "brightness") {
      brightRef.current = setTimeout(() => setBrightHud(false), 800);
      return;
    }
    handleTap(e);
  };

  const pointerFrac = (clientX) => {
    const rect = barRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  };

  const onBarDown = (e) => {
    e.stopPropagation();
    barRef.current.setPointerCapture(e.pointerId);
    setDragging(true);
    setVisible(true);
    setDragTime(pointerFrac(e.clientX) * DURATION);
  };
  const onBarMove = (e) => { if (dragging) setDragTime(pointerFrac(e.clientX) * DURATION); };
  const onBarUp = () => {
    if (!dragging) return;
    setTime(dragTime);
    setDragging(false);
    setDragTime(null);
    scheduleHide();
  };

  const shownTime = dragging && dragTime != null ? dragTime : time;
  const frac = shownTime / DURATION;
  const speedPct = ((speed - 0.5) / 1.0) * 100;

  const openSpeed = () => { setSpeedOpen(true); setVisible(true); setScreen(null); };

  return (
    <div className="phone">
      <div className="stage" onPointerDown={onStageDown} onPointerMove={onStageMove}
           onPointerUp={onStageUp} onPointerCancel={onStageUp}>
        <div className="grain" />
        <div className="poster-text"><small>NETFLIX ORIGINAL</small>THE<br />HANDLER</div>
        <div className="frame" style={{ opacity: 1 - brightness }} />
        {brightHud && (
          <div className="brightness">
            <Ico name="brightness" size={22} />
            <div className="vrail"><div className="vfill" style={{ height: brightness * 100 + "%" }} /></div>
          </div>
        )}
      </div>

      <div className="scrim top" style={{ opacity: visible && !nextShown ? 1 : 0 }} />
      <div className="scrim bottom" style={{ opacity: visible && !nextShown ? 1 : 0 }} />

      <div className={"overlay" + (visible && !nextShown && !locked && !screen ? "" : " hidden")}>
        <TopBar
          onBack={() => flashToast("Back to browse")}
          onReport={() => setScreen("report")}
          onLock={() => { setLocked(true); setVisible(true); }}
          rating={rating}
          setRating={setRating}
        />

        <div className="center">
          <button className="bigbtn" aria-label="Rewind ten seconds" onClick={() => { seekBy(-10); flashNudge("left"); }}>
            <Ico name="back10" size={46} />
          </button>
          <button className="bigbtn" aria-label={playing ? "Pause" : "Play"}
                  onClick={() => { setPlaying((p) => !p); setVisible(true); }}>
            <Ico name={playing ? "pause" : "play"} size={44} />
          </button>
          <button className="bigbtn" aria-label="Forward ten seconds" onClick={() => { seekBy(10); flashNudge("right"); }}>
            <Ico name="forward10" size={46} />
          </button>
        </div>

        <div className="bottombar">
          <div ref={barRef} className={"scrub" + (dragging ? " expanded" : "")}
               onPointerDown={onBarDown} onPointerMove={onBarMove}
               onPointerUp={onBarUp} onPointerCancel={onBarUp}>
            <div className="track">
              <div className="buffer" style={{ width: Math.min(1, frac + 0.14) * 100 + "%" }} />
              <div className="fill" style={{ width: frac * 100 + "%" }} />
              {CHAPTERS.map((c, i) => <div key={i} className="chapter" style={{ left: c * 100 + "%" }} />)}
              <div className="thumb" style={{ left: frac * 100 + "%" }} />
            </div>
            {dragging && (
              <div className="preview" style={{ left: frac * 100 + "%" }}>
                <div className="thumbimg">PREVIEW</div>
                <div className="time">{fmt(shownTime)}</div>
              </div>
            )}
          </div>

          <div className="times">
            <span>{fmt(shownTime)}</span>
            <span>-{fmt(DURATION - shownTime)}</span>
          </div>

          {speedOpen && (
            <div className="speedrow">
              <span className="val">{speed === 1 ? "Normal" : speed + "x"}</span>
              <input type="range" min="0.5" max="1.5" step="0.25" value={speed}
                     style={{ "--pct": speedPct + "%" }}
                     onChange={(e) => setSpeed(parseFloat(e.target.value))} />
            </div>
          )}

          <div className="buttons">
            <button className={"vbtn" + (screen === "episodes" ? " on" : "")}
                    onClick={() => { setScreen("episodes"); setSpeedOpen(false); }}>
              <span className="glyph"><Ico name="episodes" size={24} /></span>
              <span>Episodes</span>
            </button>
            <button className={"vbtn" + (screen === "audio" ? " on" : "")}
                    onClick={() => { setScreen("audio"); setSpeedOpen(false); }}>
              <span className="glyph"><Ico name="subtitles" size={24} /></span>
              <span>Audio &amp; Subtitles</span>
            </button>
            <button className={"vbtn" + (speedOpen ? " on" : "")}
                    onClick={() => (speedOpen ? setSpeedOpen(false) : openSpeed())}>
              <span className="glyph"><Ico name="speed" size={24} /></span>
              <span>Playback Speed</span>
            </button>
            <button className="vbtn" onClick={() => setTime(DURATION * NEXT_AT)}>
              <span className="glyph"><Ico name="nextEpisode" size={24} /></span>
              <span>Next Episode</span>
            </button>
          </div>
        </div>
      </div>

      {introVisible && !locked && (
        <button className="pill" onClick={() => { setSkipDismissed(true); setTime(INTRO_AT + INTRO_WINDOW); }}>
          <Ring seconds={introLeft} total={INTRO_WINDOW} />
          Skip Intro
        </button>
      )}

      {nudge && (
        <div key={nudge.id} className={"nudge " + nudge.side}>
          <Ico name={nudge.side === "left" ? "back10" : "forward10"} size={30} />
          <span>10 sec</span>
        </div>
      )}

      {locked && (
        <div className="locked-badge" onClick={() => setLockPrompt(true)}>
          <Ico name="lock" size={18} />
          <span>Tap to unlock</span>
        </div>
      )}

      {nextShown && (
        <div className="postplay">
          <div className="card">
            <div className="np-art">NEXT EP</div>
            <div className="np-meta">
              <div className="np-label">NEXT EPISODE</div>
              <div className="np-title">S1:E5 · Fallout</div>
              <div className="np-sub">51m · 2026 · TV-MA · Dizi</div>
            </div>
            <div className="np-actions">
              <button className="playbtn-filled" onClick={() => { setTime(0); setPlaying(true); }}>
                <Ico name="play" size={16} /> Play
              </button>
              <button className="ghostbtn" onClick={() => setScreen("episodes")}>
                <Ico name="episodes" size={17} /> Episodes &amp; Info
              </button>
              <div className="countdown">Playing in <b>{autoNext}</b>s</div>
            </div>
          </div>
        </div>
      )}

      {screen === "audio" && (
        <AudioSubtitles onClose={() => setScreen(null)} audio={audio} setAudio={setAudio} sub={sub} setSub={setSub} />
      )}
      {screen === "episodes" && (
        <Episodes onClose={() => setScreen(null)} playing={PLAYING_EP}
                  onPlay={() => { setTime(0); setPlaying(true); setScreen(null); }} />
      )}
      {screen === "report" && (
        <Report onClose={() => setScreen(null)}
                onSubmit={() => { setScreen(null); flashToast("Report submitted"); }} />
      )}

      {lockPrompt && (
        <div className="modal">
          <div className="box">
            <h3>Confirm unlock playback controls?</h3>
            <p>Tap Unlock to show the player controls again.</p>
            <div className="row">
              <button className="ghostbtn" onClick={() => setLockPrompt(false)}>Cancel</button>
              <button className="playbtn-filled" onClick={() => { setLocked(false); setLockPrompt(false); setVisible(true); }}>
                Unlock
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}

      <div className="hint">Netflix mobile player · mockup</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
